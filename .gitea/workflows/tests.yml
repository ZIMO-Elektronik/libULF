name: tests

on: 
  push: 
    branches: [master]
  pull_request: 
    branches: [master]
  
  jobs: 
    x86_64_linux-gnu-gcc: 
      runs-on: ubuntu-24.04
      steps: 
        -uses: actions/checkout@v5.0.0
          with: 
            fetch-depth: 0
          -run: cmake --preset "debug_amd64"
          -run: cmake --build build --parallel --target Tests
          -run: ctest --preset "test"
